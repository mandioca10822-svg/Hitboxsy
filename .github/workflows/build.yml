name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - run: |
          unzip -q *.zip
          cd "$(ls -d */ | head -1)"
          gradle build
          mkdir -p ../out
          cp $(ls build/libs/*.jar | grep -v sources) ../out/
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: out/*.jar
